{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-monitor.fullname" . }}-web
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "uptime-monitor.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ .Values.servicesYaml | sha256sum }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptime-monitor.dbSecretName" . }}
                  key: {{ include "uptime-monitor.dbSecretKey" . }}
            - name: SERVICES_CONFIG
              value: services.yaml
            {{ if .Values.cronSecret }}
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptime-monitor.cronSecretName" . }}
                  key: CRON_SECRET
            {{ end }}
          volumeMounts:
            - name: config
              mountPath: /app/services.yaml
              subPath: services.yaml
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "uptime-monitor.fullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uptime-monitor.fullname" . }}-web
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
