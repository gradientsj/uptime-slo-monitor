{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-monitor.fullname" . }}-worker
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "uptime-monitor.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ .Values.servicesYaml | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-metrics
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PROBE_SCHEDULE
              value: {{ .Values.worker.schedule | quote }}
            - name: RETENTION_DAYS
              value: {{ .Values.worker.retentionDays | quote }}
            - name: SERVICES_CONFIG
              value: services.yaml
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptime-monitor.dbSecretName" . }}
                  key: {{ include "uptime-monitor.dbSecretKey" . }}
          volumeMounts:
            - name: config
              mountPath: /app/services.yaml
              subPath: services.yaml
          livenessProbe:
            httpGet: { path: /healthz, port: http-metrics }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http-metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "uptime-monitor.fullname" . }}-config
{{- end }}
