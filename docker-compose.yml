# =============================================================================
# Full local stack: Postgres + migrations + probe worker + status-page web +
# Prometheus + Grafana. Brings the entire system up end to end:
#
#   docker compose up --build
#
#   status page   -> http://localhost:3000
#   worker metrics-> http://localhost:8080/metrics
#   prometheus    -> http://localhost:9090
#   grafana       -> http://localhost:3001   (admin / admin)
# =============================================================================
name: uptime-slo-monitor

x-db-url: &db_url "postgres://postgres:postgres@postgres:5432/uptime?sslmode=disable"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptime"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["npx", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: *db_url
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: *db_url
      PROBE_SCHEDULE: "* * * * *"
      RETENTION_DAYS: "45"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: *db_url
      CRON_SECRET: local-dev-secret
      NEXT_PUBLIC_SITE_NAME: "Uptime & SLO Monitor"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
